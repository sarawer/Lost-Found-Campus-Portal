<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Claim Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4" th:text="${claim.id} == null ? 'Add Claim' : 'Update Claim'"></h2>

    <form th:action="@{/claims/save}" th:object="${claim}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input type="text" class="form-control" th:field="*{itemName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Claimer Student ID</label>
            <input type="text" class="form-control" th:field="*{claimerStudentId}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Claimer Name</label>
            <input type="text" class="form-control" th:field="*{claimerName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Claimer Contact</label>
            <input type="text" class="form-control" th:field="*{claimerContact}">
        </div>

        <div class="mb-3">
            <label class="form-label">Claim Date</label>
            <input type="date" class="form-control" th:field="*{claimDate}">
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/claims}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
