<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Submit Claim - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('claims')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="form-card w-100" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1" th:text="${claim.id} == null ? 'Submit a Claim' : 'Update Claim'"></h2>
            <p class="text-muted">Provide verification details for ownership</p>
        </div>

        <div class="privacy-notice">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <strong>Verification Notice:</strong> To protect against false claims, some item details are hidden. Please provide information that proves this item belongs to you.
        </div>

        <form th:action="@{/claims/save}" th:object="${claim}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" required placeholder="Name of the item you are claiming">
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Your Student ID</label>
                    <input type="text" class="form-control" th:field="*{claimerStudentId}" required placeholder="e.g. 20240001">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Your Full Name</label>
                    <input type="text" class="form-control" th:field="*{claimerName}" required>
                </div>
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Info (Private)</label>
                    <input type="text" class="form-control" th:field="*{claimerContact}" placeholder="Phone number">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Approx. Lost/Found Date</label>
                    <input type="date" class="form-control" th:field="*{claimDate}">
                </div>
            </div>

            <div class="mb-4" sec:authorize="hasRole('ADMIN')">
                <label class="form-label text-danger fw-bold">Admin: Status</label>
                <select class="form-select border-danger" th:field="*{status}">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            
            <!-- Hide status select for normal users and force pending, though the controller should handle this. We hide it for non-admins -->
            <div class="mb-4 d-none" sec:authorize="!hasRole('ADMIN')">
                <input type="hidden" th:field="*{status}" value="pending" />
            </div>

            <div class="d-flex gap-3 mt-4">
                <a th:href="@{/claims}" class="btn btn-secondary w-50">Cancel</a>
                <button type="submit" class="btn btn-primary w-50" th:text="${claim.id} == null ? 'Submit Claim' : 'Update Claim'"></button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
