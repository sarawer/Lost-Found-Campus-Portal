<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            SEU CampusFinder
        </a>
    </div>
</nav>

<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="form-card w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Forgot Password</h2>
            <p class="text-muted">Enter your SEU email to reset your password</p>
        </div>

        <div th:if="${message}" class="alert alert-success border-0 bg-success bg-opacity-10 text-success rounded-3 p-3 mb-4 fs-6">
            <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 fs-6">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="form-label">SEU Email</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="student@seu.edu.bd" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill fw-bold">Send Reset Link</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted" style="font-size: 0.95rem;">
            Remember your password? <a th:href="@{/login}" class="text-primary text-decoration-none fw-bold">Login here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
