<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('lost')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="form-card w-100" style="max-width: 600px;">
        <div class="text-center mb-4">
            <span class="badge badge-lost mb-2">Report Lost</span>
            <h2 class="fw-bold mb-1" th:text="${lostItem.id} == null ? 'Report Lost Item' : 'Update Lost Item'"></h2>
            <p class="text-muted">Provide details to help find your lost item.</p>
        </div>

        <div class="privacy-notice">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <strong>Privacy Note:</strong> Your detailed description and contact info will not be shown publicly. It will only be used to verify ownership if someone claims the item.
        </div>

        <form th:action="@{/lost/save}" th:object="${lostItem}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="row gx-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="text" class="form-control" th:field="*{studentId}" required placeholder="e.g. 20240001">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Info (Private)</label>
                    <input type="text" class="form-control" th:field="*{contactInfo}" placeholder="Phone number">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" required placeholder="e.g. Black Leather Wallet">
            </div>

            <div class="mb-3">
                <label class="form-label">Detailed Description (Private)</label>
                <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Include any unique identifying characteristics..."></textarea>
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Lost Location</label>
                    <input type="text" class="form-control" th:field="*{lostLocation}" placeholder="e.g. Library, 3rd Floor">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Lost Date</label>
                    <input type="date" class="form-control" th:field="*{lostDate}">
                </div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/lost}" class="btn btn-secondary w-50">Cancel</a>
                <button type="submit" class="btn btn-primary w-50" th:text="${lostItem.id} == null ? 'Report Lost Item' : 'Update Item'"></button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
