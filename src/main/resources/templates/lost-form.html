<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lost Item Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav class="navbar navbar-dark site-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Lost & Found Campus Portal</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/lost}">Lost Items</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/found}">Found Items</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/claims}">Claims</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-center" th:text="${lostItem.id} == null ? 'Add Lost Item' : 'Update Lost Item'"></h2>

    <div class="ticket-card">
        <form th:action="@{/lost/save}" th:object="${lostItem}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" class="form-control" th:field="*{studentId}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Lost Location</label>
                <input type="text" class="form-control" th:field="*{lostLocation}">
            </div>

            <div class="mb-3">
                <label class="form-label">Lost Date</label>
                <input type="date" class="form-control" th:field="*{lostDate}">
            </div>

            <div class="mb-3">
                <label class="form-label">Contact Info</label>
                <input type="text" class="form-control" th:field="*{contactInfo}">
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/lost}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
