<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-1"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            SEU CampusFinder
        </a>
    </div>
</nav>

<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="form-card w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Create an Account</h2>
            <p class="text-muted">Join SEU CampusFinder</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 fs-6" th:text="${error}"></div>

        <form id="registerForm" th:action="@{/register}" th:object="${appUser}" method="post">

            <div id="clientError" th:if="${false}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 fs-6" style="display:none;"></div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control form-control-lg" th:field="*{name}" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Southeast University Email</label>
                <input type="email" class="form-control form-control-lg" th:field="*{username}" placeholder="student@seu.edu.bd" pattern=".+@seu\.edu\.bd$" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" th:field="*{password}" placeholder="Enter your password" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control form-control-lg" th:field="*{confirmPassword}" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill fw-bold">Register</button>
        </form>

        <script>
            // Client-side validation to improve UX (keeps server-side validation as authoritative)
            (function(){
                const form = document.getElementById('registerForm');
                const clientError = document.getElementById('clientError');

                function showError(msg) {
                    clientError.textContent = msg;
                    clientError.style.display = 'block';
                }

                function hideError() {
                    clientError.textContent = '';
                    clientError.style.display = 'none';
                }

                form.addEventListener('submit', function(e){
                    hideError();

                    const name = form.querySelector('[name="name"]').value.trim();
                    const username = form.querySelector('[name="username"]').value.trim();
                    const password = form.querySelector('[name="password"]').value;
                    const confirm = form.querySelector('[name="confirmPassword"]').value;

                    if (!name) {
                        e.preventDefault();
                        showError('Full name must not be blank.');
                        return;
                    }

                    if (!username) {
                        e.preventDefault();
                        showError('SEU email must not be blank.');
                        return;
                    }

                    if (!username.toLowerCase().endsWith('@seu.edu.bd')) {
                        e.preventDefault();
                        showError('SEU email must end with @seu.edu.bd.');
                        return;
                    }

                    if (!password) {
                        e.preventDefault();
                        showError('Password must not be blank.');
                        return;
                    }

                    if (!confirm) {
                        e.preventDefault();
                        showError('Please confirm your password.');
                        return;
                    }

                    if (password !== confirm) {
                        e.preventDefault();
                        showError('Password and Confirm Password do not match.');
                        return;
                    }

                    // allow submit; server-side will perform final validation
                });
            })();
        </script>

        <p class="text-center mt-4 mb-0 text-muted" style="font-size: 0.95rem;">
            Already have an account? <a th:href="@{/login}" class="text-primary text-decoration-none fw-bold">Login here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
