<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-1"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            SEU CampusFinder
        </a>
    </div>
</nav>

<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="form-card w-100" style="max-width: 460px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Create an Account</h2>
            <p class="text-muted">Use your @seu.edu.bd email</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 fs-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${appUser}" method="post">

            <div class="mb-4">
                <label class="form-label">SEU Email</label>
                <input type="email" class="form-control form-control-lg" th:field="*{username}" placeholder="student@seu.edu.bd" required autofocus>
                <div class="form-text mt-2 text-muted" style="font-size: 0.8rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="me-1"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                    Only @seu.edu.bd domains are allowed.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" th:field="*{password}" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control form-control-lg" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill fw-bold">Register</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted" style="font-size: 0.95rem;">
            Already have an account? <a th:href="@{/login}" class="text-primary text-decoration-none fw-bold">Login here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
