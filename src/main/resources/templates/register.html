<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-1"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            SEU CampusFinder
        </a>
    </div>
</nav>

<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="form-card w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Create an Account</h2>
            <p class="text-muted">Join SEU CampusFinder</p>
        </div>

        <form id="registerForm" th:action="@{/register}" th:object="${appUser}" method="post" novalidate>
            <div th:if="${emailError != null}" class="form-alert mb-4 alert alert-danger" style="background-color: #f8d7da; color: #842029; border-color: #f5c2c7; padding: 1rem; border-radius: 0.375rem; display: flex; align-items: center;">
                <span class="form-alert-icon me-2 fw-bold" style="background: transparent; color: #842029;">!</span>
                <span th:text="${emailError}"></span>
            </div>
            <div th:if="${#fields.hasAnyErrors() or (passwordMismatch != null and passwordMismatch) or (userTaken != null and userTaken)}" class="form-alert mb-4">
                <span class="form-alert-icon">!</span>
                <span>Please fix the highlighted fields and try again.</span>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control form-control-lg" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''" placeholder="Enter your full name" required autofocus>
                <div class="invalid-feedback d-block field-error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Southeast University Email</label>
                <input type="email" class="form-control form-control-lg" th:field="*{username}" th:classappend="${#fields.hasErrors('username') or (userTaken != null and userTaken)} ? ' is-invalid' : ''" placeholder="student@seu.edu.bd" required>
                <div class="invalid-feedback d-block field-error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                <div class="invalid-feedback d-block field-error-message" th:if="${userTaken != null and userTaken}">This SEU email is already registered.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="position-relative">
                    <input type="password" id="password" class="form-control form-control-lg pe-5" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''" placeholder="Enter your password" required>
                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted" id="togglePassword1" style="border: none; background: transparent; z-index: 10;">
                        <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="invalid-feedback d-block field-error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <div class="position-relative">
                    <input type="password" id="confirmPassword" class="form-control form-control-lg pe-5" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword') or (passwordMismatch != null and passwordMismatch)} ? ' is-invalid' : ''" placeholder="Confirm your password" required>
                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted" id="togglePassword2" style="border: none; background: transparent; z-index: 10;">
                        <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="invalid-feedback d-block field-error-message" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                <div class="invalid-feedback d-block field-error-message" th:if="${passwordMismatch != null and passwordMismatch}">Password and Confirm Password do not match.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill fw-bold">Register</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted" style="font-size: 0.95rem;">
            Already have an account? <a th:href="@{/login}" class="text-primary text-decoration-none fw-bold">Login here</a>
        </p>
    </div>
</div>

<script>
    function toggleVisibility(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    document.getElementById('togglePassword1').addEventListener('click', () => toggleVisibility('password', 'eyeIcon1'));
    document.getElementById('togglePassword2').addEventListener('click', () => toggleVisibility('confirmPassword', 'eyeIcon2'));
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
