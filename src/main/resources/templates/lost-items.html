<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lost Item Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<nav class="navbar navbar-dark site-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Lost & Found Campus Portal</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/lost}">Lost Items</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/found}">Found Items</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/claims}">Claims</a>
        </div>
    </div>
</nav>


<body>
<div class="container mt-5">
    <h2 class="mb-4">Lost Items</h2>

    <a th:if="${!isAdmin}" th:href="@{/lost/add}" class="btn btn-primary mb-3">Add Lost Item</a>

    <div th:if="${#lists.isEmpty(lostItems)}" class="alert alert-secondary">
        No items to show.
    </div>

    <table th:if="${!#lists.isEmpty(lostItems)}" class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Student ID</th>
            <th>Item Name</th>
            <th>Description</th>
            <th>Lost Location</th>
            <th>Lost Date</th>
            <th>Contact Info</th>
            <th>Status</th>
            <th th:if="${!isAdmin}">Actions</th>
            <th th:if="${isAdmin}">Change Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${lostItems}">
            <td th:text="${item.studentId}"></td>
            <td th:text="${item.itemName}"></td>
            <td th:text="${item.description}"></td>
            <td th:text="${item.lostLocation}"></td>
            <td th:text="${item.lostDate}"></td>
            <td th:text="${item.contactInfo}"></td>
            <td th:text="${item.status}"></td>

            <!-- USER দেখবে: Update/Delete -->
            <td th:if="${!isAdmin}">
                <a th:href="@{/lost/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">Update</a>
                <a th:href="@{/lost/delete/{id}(id=${item.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
            </td>

            <!-- ADMIN দেখবে: শুধু status dropdown -->
            <td th:if="${isAdmin}">
                <form th:action="@{/lost/status/{id}(id=${item.id})}" method="post" class="d-flex gap-2">
                    <select name="status" class="form-select form-select-sm">
                        <option value="pending" th:selected="${item.status == 'pending'}">Pending</option>
                        <option value="resolved" th:selected="${item.status == 'resolved'}">Resolved</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
