<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lost Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Lost & Found Campus Portal</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/lost}">Lost Items</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/found}">Found Items</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/claims}">Claims</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2 class="mb-4">Lost Items</h2>

    <a th:href="@{/lost/add}" class="btn btn-primary mb-3">Add Lost Item</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Student ID</th>
            <th>Item Name</th>
            <th>Description</th>
            <th>Lost Location</th>
            <th>Lost Date</th>
            <th>Contact Info</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${lostItems}">
            <td th:text="${item.studentId}"></td>
            <td th:text="${item.itemName}"></td>
            <td th:text="${item.description}"></td>
            <td th:text="${item.lostLocation}"></td>
            <td th:text="${item.lostDate}"></td>
            <td th:text="${item.contactInfo}"></td>
            <td>
                <a th:href="@{/lost/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">Update</a>
                <a th:href="@{/lost/delete/{id}(id=${item.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
