<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Found Item Details - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('found')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="item-detail-card">
                <div class="item-detail-image-wrap">
                    <img th:if="${item.imageData != null}" th:src="${item.imageDataUri}" alt="Found item image" class="img-fluid">
                    <div th:if="${item.imageData == null}" class="item-detail-placeholder">
                        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                </div>
                <div class="p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge badge-found">FOUND</span>
                        <span class="text-muted small" th:text="${item.status != null ? #strings.toUpperCase(item.status) : 'PENDING'}"></span>
                    </div>
                    <h2 class="fw-bold mb-3" th:text="${item.itemName}">Item Name</h2>
                    <div class="detail-grid">
                        <div>
                            <span class="detail-label">Location</span>
                            <span class="detail-value" th:text="${item.foundLocation != null ? item.foundLocation : 'Location not provided'}"></span>
                        </div>
                        <div>
                            <span class="detail-label">Date</span>
                            <span class="detail-value" th:text="${item.foundDate != null ? item.foundDate : 'Date not provided'}"></span>
                        </div>
                        <div>
                            <span class="detail-label">Reporter</span>
                            <span class="detail-value" th:text="${item.createdBy != null ? item.createdBy : 'Unknown'}"></span>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h5 class="fw-bold mb-2">Description</h5>
                        <p class="text-muted mb-0" th:text="${item.description != null and !#strings.isEmpty(item.description) ? item.description : 'No description provided.'}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="comment-panel">
                <h4 class="fw-bold mb-3">Comments</h4>

                <div th:if="${#lists.isEmpty(comments)}" class="empty-comment">
                    No comments yet. Be the first to leave one.
                </div>

                <div th:unless="${#lists.isEmpty(comments)}" class="comment-list">
                    <div class="comment-item" th:each="comment : ${comments}">
                        <div class="comment-head">
                            <strong th:text="${comment.user != null ? comment.user.name : 'User'}">User</strong>
                            <span th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
                        </div>
                        <div class="comment-body" th:text="${comment.content}"></div>
                    </div>
                </div>

                <form th:action="@{/found/{id}/comments(id=${item.id})}" method="post" class="comment-form mt-4">
                    <label class="form-label fw-medium">Write a comment</label>
                    <textarea name="content" rows="4" class="form-control" placeholder="Write a comment..."></textarea>
                    <button type="submit" class="btn btn-primary mt-3 w-100">Post Comment</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
