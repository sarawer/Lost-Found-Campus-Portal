<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Claims</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Lost & Found Campus Portal</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/lost}">Lost Items</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/found}">Found Items</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/claims}">Claims</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2 class="mb-4">Claims</h2>

    <a th:href="@{/claims/add}" class="btn btn-primary mb-3">Add Claim</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Item Name</th>
            <th>Claimer Student ID</th>
            <th>Claimer Name</th>
            <th>Claimer Contact</th>
            <th>Claim Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${claims}">
            <td th:text="${c.itemName}"></td>
            <td th:text="${c.claimerStudentId}"></td>
            <td th:text="${c.claimerName}"></td>
            <td th:text="${c.claimerContact}"></td>
            <td th:text="${c.claimDate}"></td>
            <td>
                <span th:text="${c.status}"
                      th:classappend="${c.status == 'approved'} ? 'badge bg-success' : (${c.status == 'rejected'} ? 'badge bg-danger' : 'badge bg-warning text-dark')">
                </span>
            </td>
            <td>
                <a th:href="@{/claims/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Update</a>
                <a th:href="@{/claims/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this claim?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
