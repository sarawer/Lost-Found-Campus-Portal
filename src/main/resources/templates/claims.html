<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Claims - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('claims')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Item Claims</h2>
            <p class="text-muted mb-0">Track and manage item ownership claims</p>
        </div>
        <a th:href="@{/claims/add}" class="btn btn-primary shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Submit Claim
        </a>
    </div>

    <div th:if="${#lists.isEmpty(claims)}" class="empty-state">
        <div class="mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" class="text-muted"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h5>No claims found</h5>
        <p class="mb-0">There are currently no claims to display.</p>
    </div>

    <div th:if="${!#lists.isEmpty(claims)}" class="table-card bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Item Claimed</th>
                    <th>Claimer ID</th>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${claims}">
                    <td class="ps-4 fw-medium text-main" th:text="${c.itemName}"></td>
                    <td th:text="${c.claimerStudentId}"></td>
                    <td th:text="${c.claimerName}"></td>
                    <td th:text="${c.claimDate}"></td>
                    <td>
                        <span th:if="${c.status == 'pending'}" class="badge badge-pending">PENDING</span>
                        <span th:if="${c.status == 'approved'}" class="badge badge-approved">APPROVED</span>
                        <span th:if="${c.status == 'rejected'}" class="badge badge-rejected">REJECTED</span>
                        <span th:if="${c.status != 'pending' and c.status != 'approved' and c.status != 'rejected'}" class="badge badge-pending" th:text="${#strings.toUpperCase(c.status)}"></span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="btn-group">
                            <a th:href="@{/claims/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Update</a>
                            <a th:href="@{/claims/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this claim?');">Delete</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
