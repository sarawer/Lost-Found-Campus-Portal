<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Claims</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav class="navbar navbar-dark site-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Lost & Found Campus Portal</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/lost}">Lost Items</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/found}">Found Items</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/claims}">Claims</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Claims</h2>

    <a th:href="@{/claims/add}" class="btn btn-primary mb-3">Add Claim</a>

    <div class="table-card">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Item Name</th>
                <th>Claimer Student ID</th>
                <th>Claimer Name</th>
                <th>Claimer Contact</th>
                <th>Claim Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${claims}">
                <td th:text="${c.itemName}"></td>
                <td th:text="${c.claimerStudentId}"></td>
                <td th:text="${c.claimerName}"></td>
                <td th:text="${c.claimerContact}"></td>
                <td th:text="${c.claimDate}"></td>
                <td>
                    <span th:text="${c.status}" th:classappend="${c.status}" class="status-stamp"></span>
                </td>
                <td>
                    <a th:href="@{/claims/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Update</a>
                    <a th:href="@{/claims/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this claim?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
