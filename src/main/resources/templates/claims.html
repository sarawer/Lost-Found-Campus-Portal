<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('claims')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Admin Dashboard</h2>
        <p class="text-muted mb-0">Review pending lost and found reports</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="table-card bg-white p-3">
                <h4 class="fw-bold mb-3">Pending Lost Item Reports</h4>

                <div th:if="${#lists.isEmpty(pendingLostItems)}" class="empty-state small-empty">
                    <p class="mb-0">No pending lost reports.</p>
                </div>

                <div th:if="${!#lists.isEmpty(pendingLostItems)}" class="list-group list-group-flush">
                    <div th:each="item : ${pendingLostItems}" class="list-group-item px-0">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${item.itemName}">Item</h6>
                                <div class="text-muted small" th:text="${item.lostLocation != null ? item.lostLocation : 'Location unknown'}"></div>
                                <div class="text-muted small" th:text="${item.createdBy != null ? 'Reported by: ' + item.createdBy : 'Reported by: Unknown'}"></div>
                            </div>
                            <div class="d-flex gap-2">
                                <form th:action="@{/claims/lost/{id}/approve(id=${item.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-success">Approve</button>
                                </form>
                                <form th:action="@{/claims/lost/{id}/delete(id=${item.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this report?');">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="table-card bg-white p-3">
                <h4 class="fw-bold mb-3">Pending Found Item Reports</h4>

                <div th:if="${#lists.isEmpty(pendingFoundItems)}" class="empty-state small-empty">
                    <p class="mb-0">No pending found reports.</p>
                </div>

                <div th:if="${!#lists.isEmpty(pendingFoundItems)}" class="list-group list-group-flush">
                    <div th:each="item : ${pendingFoundItems}" class="list-group-item px-0">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${item.itemName}">Item</h6>
                                <div class="text-muted small" th:text="${item.foundLocation != null ? item.foundLocation : 'Location unknown'}"></div>
                                <div class="text-muted small" th:text="${item.createdBy != null ? 'Reported by: ' + item.createdBy : 'Reported by: Unknown'}"></div>
                            </div>
                            <div class="d-flex gap-2">
                                <form th:action="@{/claims/found/{id}/approve(id=${item.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-success">Approve</button>
                                </form>
                                <form th:action="@{/claims/found/{id}/delete(id=${item.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this report?');">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
