<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Verify Email - SEU CampusFinder</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/style.css}">

</head>


<body class="d-flex flex-column min-vh-100 bg-light">


<nav class="navbar site-navbar sticky-top">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            SEU CampusFinder
        </a>

    </div>

</nav>


<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">

    <div class="form-card w-100" style="max-width: 440px;">

        <div class="text-center mb-4">

            <h2 class="fw-bold mb-1">
                Verify Your Email
            </h2>

            <p class="text-muted">
                We've sent a verification code to
            </p>

            <p class="fw-bold text-primary" th:text="${email}">
                student@seu.edu.bd
            </p>

        </div>


        <!-- Error -->

        <div
                th:if="${error}"
                class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4">

            <span th:text="${error}"></span>

        </div>


        <form th:action="@{/verify-otp}" method="post">


            <div class="mb-4">

                <label class="form-label">
                    Verification Code
                </label>

                <input
                        type="text"
                        name="otp"
                        class="form-control form-control-lg text-center"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                        autofocus>

            </div>


            <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">

                Verify Email

            </button>

        </form>


        <p class="text-center text-muted mt-4 mb-0"
           style="font-size: 0.9rem;">

            The verification code will expire in 5 minutes.

        </p>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
