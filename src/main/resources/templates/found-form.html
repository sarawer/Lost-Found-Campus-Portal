<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Report Found Item - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('found')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="form-card w-100" style="max-width: 600px;">
        <div class="text-center mb-4">
            <span class="badge badge-found mb-2">Report Found</span>
            <h2 class="fw-bold mb-1" th:text="${foundItem.id} == null ? 'Report Found Item' : 'Update Found Item'"></h2>
            <p class="text-muted">Post details to help return this item.</p>
        </div>

        <div class="privacy-notice">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <strong>Privacy Note:</strong> Detailed information is kept private to help verify the rightful owner against false claims.
        </div>

        <form th:action="@{/found/save}" th:object="${foundItem}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}"/>

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-3 fs-6">
                Please fix the highlighted fields and try again.
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Your Student ID</label>
                    <input type="text" class="form-control" th:field="*{studentId}" th:classappend="${#fields.hasErrors('studentId')} ? ' is-invalid' : ''" required placeholder="e.g. 20240001">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Info (Private)</label>
                    <input type="text" class="form-control" th:field="*{contactInfo}" placeholder="Phone number">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" th:classappend="${#fields.hasErrors('itemName')} ? ' is-invalid' : ''" required placeholder="e.g. Blue Student ID Folder">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Detailed Description (Private)</label>
                <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Describe the item. Hide unique characteristics if possible..."></textarea>
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Found Location</label>
                    <input type="text" class="form-control" th:field="*{foundLocation}" placeholder="e.g. Library, 3rd Floor">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Found Date</label>
                    <input type="date" class="form-control" th:field="*{foundDate}" th:classappend="${#fields.hasErrors('foundDate')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('foundDate')}" th:errors="*{foundDate}"></div>
                </div>
            </div>

            <div class="mb-4" th:if="${foundItem.imageData != null}">
                <label class="form-label">Current Item Image</label>
                <div class="border rounded-3 p-2 bg-light">
                    <img th:src="${foundItem.imageDataUri}" alt="Current found item image" class="img-fluid rounded-2" style="max-height: 240px; object-fit: cover;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Item Image</label>
                <input type="file" name="imageFile" accept="image/*" class="form-control">
                <div class="form-text">Attach a clear photo of the item (optional).</div>
                <div class="invalid-feedback d-block" th:if="${imageUploadError != null}" th:text="${imageUploadError}"></div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/found}" class="btn btn-secondary w-50">Cancel</a>
                <button type="submit" class="btn btn-primary w-50" th:text="${foundItem.id} == null ? 'Report Found Item' : 'Update Item'"></button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
