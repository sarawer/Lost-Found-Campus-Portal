<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Found Item Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4" th:text="${foundItem.id} == null ? 'Add Found Item' : 'Update Found Item'"></h2>

    <form th:action="@{/found/save}" th:object="${foundItem}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input type="text" class="form-control" th:field="*{studentId}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input type="text" class="form-control" th:field="*{itemName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Found Location</label>
            <input type="text" class="form-control" th:field="*{foundLocation}">
        </div>

        <div class="mb-3">
            <label class="form-label">Found Date</label>
            <input type="date" class="form-control" th:field="*{foundDate}">
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Info</label>
            <input type="text" class="form-control" th:field="*{contactInfo}">
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/found}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
