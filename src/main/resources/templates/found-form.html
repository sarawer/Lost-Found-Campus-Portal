<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Report Found Item - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-1"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            SEU CampusFinder
        </a>
        <button class="navbar-toggler d-md-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse d-md-flex justify-content-end" id="navbarMenu">
            <div class="d-flex flex-column flex-md-row align-items-md-center mt-3 mt-md-0">
                <a class="nav-btn me-md-2" th:href="@{/}">Home</a>
                <a class="nav-btn me-md-2" th:href="@{/lost}">Lost Items</a>
                <a class="nav-btn me-md-3" th:href="@{/found}">Found Items</a>

                <span sec:authorize="isAuthenticated()" class="d-flex align-items-center mt-2 mt-md-0">
                    <a class="nav-btn me-md-3" th:href="@{/claims}">My Claims</a>
                    <span class="nav-user me-3 text-muted">
                        Hi, <span class="text-main fw-bold" sec:authentication="name"></span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <button type="submit" class="nav-btn border-0 bg-transparent text-danger">Logout</button>
                    </form>
                </span>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5 flex-grow-1">
    <div class="form-card w-100" style="max-width: 600px;">
        <div class="text-center mb-4">
            <span class="badge badge-found mb-2">Report Found</span>
            <h2 class="fw-bold mb-1" th:text="${foundItem.id} == null ? 'Report Found Item' : 'Update Found Item'"></h2>
            <p class="text-muted">Post details to help return this item.</p>
        </div>

        <div class="privacy-notice">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <strong>Privacy Note:</strong> Detailed information is kept private to help verify the rightful owner against false claims.
        </div>

        <form th:action="@{/found/save}" th:object="${foundItem}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="row gx-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Your Student ID</label>
                    <input type="text" class="form-control" th:field="*{studentId}" required placeholder="e.g. 20240001">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Info (Private)</label>
                    <input type="text" class="form-control" th:field="*{contactInfo}" placeholder="Phone number">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" required placeholder="e.g. Blue Student ID Folder">
            </div>

            <div class="mb-3">
                <label class="form-label">Detailed Description (Private)</label>
                <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Describe the item. Hide unique characteristics if possible..."></textarea>
            </div>

            <div class="row gx-3">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Found Location</label>
                    <input type="text" class="form-control" th:field="*{foundLocation}" placeholder="e.g. Library, 3rd Floor">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Found Date</label>
                    <input type="date" class="form-control" th:field="*{foundDate}">
                </div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/found}" class="btn btn-secondary w-50">Cancel</a>
                <button type="submit" class="btn btn-primary w-50" th:text="${foundItem.id} == null ? 'Report Found Item' : 'Update Item'"></button>
            </div>
        </form>
    </div>
</div>

<footer class="bg-white border-top py-4 mt-auto">
    <div class="container text-center text-muted">
        <p class="mb-0 fs-6">&copy; 2026 SEU CampusFinder. Find it. Verify it. Get it back.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
