<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Found Items - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('found')}"></div>

<div class="container py-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Found Items</h2>
            <p class="text-muted mb-0">Browse items found by SEU students</p>
        </div>
        <a th:if="${!isAdmin}" th:href="@{/found/add}" class="btn btn-primary shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="me-1 mb-1"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Report Found Item
        </a>
    </div>

    <div class="card border-0 bg-transparent shadow-none mb-4">
        <div class="row gx-2">
            <div class="col-md-8">
                <input type="text" class="form-control" placeholder="Search found items...">
            </div>
            <div class="col-md-4 mt-2 mt-md-0">
                <button class="btn btn-secondary w-100">Search</button>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(foundItems)}" class="empty-state">
        <div class="mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" class="text-muted"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <h5>No found items found</h5>
        <p class="mb-0">There are currently no found items reported on campus.</p>
    </div>

    <div th:if="${!#lists.isEmpty(foundItems)}" class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="item : ${foundItems}">
            <div class="item-card">
                <div class="item-card-img-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <div class="item-card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge badge-found">FOUND</span>
                        <span class="badge badge-pending" th:if="${item.status == 'pending'}">Pending</span>
                        <span class="badge badge-resolved" th:if="${item.status == 'resolved'}">Resolved</span>
                    </div>
                    <h3 class="item-card-title" th:text="${item.itemName}"></h3>
                    <div class="item-card-meta">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span th:text="${item.foundLocation ?: 'Location unknown'}"></span>
                    </div>
                    <div class="item-card-meta mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <span th:text="${item.foundDate ?: 'Date unknown'}"></span>
                    </div>
                </div>
                <div class="item-card-footer flex-column align-items-stretch gap-2">
                    <div th:if="${!isAdmin}" class="d-flex gap-2">
                        <a th:href="@{/found/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary flex-grow-1">Update</a>
                        <a th:href="@{/found/delete/{id}(id=${item.id})}" class="btn btn-sm btn-outline-danger flex-grow-1"
                           onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
                    </div>
                    <div th:if="${isAdmin}">
                        <form th:action="@{/found/status/{id}(id=${item.id})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm">
                                <option value="pending" th:selected="${item.status == 'pending'}">Pending</option>
                                <option value="resolved" th:selected="${item.status == 'resolved'}">Resolved</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </div>
                    <a th:if="${!isAdmin}" th:href="@{/claims/add}" class="btn btn-sm btn-primary w-100">Claim Item</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
