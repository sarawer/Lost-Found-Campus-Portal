<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-md site-navbar sticky-top">
    <div class="container d-flex align-items-center justify-content-between">

        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            SEU CampusFinder
        </a>

        <button class="navbar-toggler d-md-none border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse d-md-flex justify-content-end" id="navbarMenu">

            <div class="d-flex flex-column flex-md-row align-items-md-center mt-3 mt-md-0">

                <!-- Common Navigation -->
                <a class="nav-btn me-md-2"
                   th:classappend="${activePage == 'home'} ? 'active' : ''"
                   th:href="@{/}">
                    Home
                </a>

                <a class="nav-btn me-md-2"
                   th:classappend="${activePage == 'lost'} ? 'active' : ''"
                   th:href="@{/lost}">
                    Lost Items
                </a>

                <a class="nav-btn me-md-3"
                   th:classappend="${activePage == 'found'} ? 'active' : ''"
                   th:href="@{/found}">
                    Found Items
                </a>


                <!-- Guest -->
                <span sec:authorize="!isAuthenticated()"
                      class="d-flex mt-2 mt-md-0">

                    <a class="nav-btn me-2"
                       th:href="@{/login}">
                        Login
                    </a>

                    <a class="nav-btn nav-btn-primary"
                       th:href="@{/register}">
                        Register
                    </a>

                </span>


                <!-- Authenticated User -->
                <span sec:authorize="isAuthenticated()"
                      class="d-flex align-items-center mt-2 mt-md-0">

                    <!-- My Reports: USER only -->
                    <a sec:authorize="hasRole('USER')"
                       class="nav-btn me-md-3"
                       th:classappend="${activePage == 'my-reports'} ? 'active' : ''"
                       th:href="@{/my-reports}">
                        My Reports
                    </a>

                    <!-- Profile Dropdown -->
                    <div class="dropdown">
                        <button class="nav-btn border-0 bg-transparent dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person-circle me-1" viewBox="0 0 16 16">
                                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                            </svg>
                            Profile
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a class="dropdown-item py-2" th:href="@{/profile}">My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0 px-3 py-1">
                                    <button type="submit" class="btn btn-danger btn-sm w-100 rounded-pill">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>

                </span>

            </div>
        </div>
    </div>
</nav>


<footer th:fragment="footer"
        class="bg-white border-top py-4 mt-auto">

    <div class="container text-center">
        <p class="mb-0">
            © 2026 SEU CampusFinder. All rights reserved.
            <span class="footer-divider">|</span>
            Developed by Md. Sarawer Bhuiyan.
        </p>
    </div>

</footer>

</body>
</html>
