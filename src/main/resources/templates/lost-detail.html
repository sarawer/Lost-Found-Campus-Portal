<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lost Item Details - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column bg-light">

<div th:replace="~{fragments :: navbar('lost')}"></div>

<div class="container py-4 py-lg-5 flex-grow-1">
    <div class="row g-4 align-items-start">
        <div class="col-lg-7">
            <div class="item-detail-card">
                <div class="item-detail-image-wrap">
                    <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                         th:src="${item.imageUrl}"
                         alt="Lost item image"
                         class="item-detail-image">

                    <div th:if="${item.imageUrl == null or #strings.isEmpty(item.imageUrl)}"
                         class="item-detail-placeholder">
                </div>

                <div class="item-detail-content">
                    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                        <span class="badge badge-lost">LOST</span>
                        <span class="detail-status" th:text="${item.status != null ? #strings.toUpperCase(item.status) : 'PENDING'}">APPROVED</span>
                    </div>

                    <h1 class="item-detail-title" th:text="${item.itemName}">Item Name</h1>

                    <div class="detail-grid">
                        <div class="detail-field">
                            <span class="detail-label">Lost Location</span>
                            <span class="detail-value" th:text="${item.lostLocation != null and !#strings.isEmpty(item.lostLocation) ? item.lostLocation : 'Location not provided'}"></span>
                        </div>
                        <div class="detail-field">
                            <span class="detail-label">Lost Date</span>
                            <span class="detail-value" th:text="${item.lostDate != null ? #temporals.format(item.lostDate, 'dd MMM yyyy') : 'Date not provided'}"></span>
                        </div>
                        <div class="detail-field">
                            <span class="detail-label">Report Date</span>
                            <span class="detail-value" th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd MMM yyyy, hh:mm a') : 'Date not available'}"></span>
                        </div>
                        <div class="detail-field">
                            <span class="detail-label">Reporter Name</span>
                            <span class="detail-value" th:text="${reporter != null ? reporter.name : 'Unknown'}"></span>
                        </div>
                        <div class="detail-field detail-field-wide">
                            <span class="detail-label">Reporter Email</span>
                            <span class="detail-value detail-email" th:text="${reporter != null ? reporter.username : (item.createdBy != null ? item.createdBy : 'Not available')}"></span>
                        </div>
                        <div class="detail-field detail-field-wide">
                            <span class="detail-label">Contact Info</span>
                            <span class="detail-value detail-email"
                                  th:text="${item.contactInfo != null and !#strings.isEmpty(item.contactInfo) ? item.contactInfo : 'Not available'}">
                            </span>
                        </div>
                    </div>

                    <div class="detail-description">
                        <h5 class="detail-section-title">Description</h5>
                        <p th:text="${item.description != null and !#strings.isEmpty(item.description) ? item.description : 'No description provided.'}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="comment-panel">
                <div class="comment-panel-header">
                    <h4 class="fw-bold mb-1">Comments</h4>
                    <p class="comment-panel-subtitle">See what other students have to say.</p>
                </div>

                <div th:if="${#lists.isEmpty(comments)}" class="empty-comment">
                    No comments yet. Be the first to leave one.
                </div>

                <div th:unless="${#lists.isEmpty(comments)}" class="comment-list">
                    <div class="comment-item" th:each="comment : ${comments}">
                        <div class="comment-head">
                            <strong th:text="${comment.user != null ? comment.user.name : 'User'}">User</strong>
                            <span th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
                        </div>
                        <div class="comment-body" th:text="${comment.content}"></div>
                    </div>
                </div>

                <form th:action="@{/lost/{id}/comments(id=${item.id})}" method="post" class="comment-form">
                    <label class="form-label fw-medium">Write a comment</label>
                    <textarea name="content" rows="4" class="form-control" placeholder="Write a comment..."></textarea>
                    <button type="submit" class="btn btn-primary mt-3 w-100">Post Comment</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
