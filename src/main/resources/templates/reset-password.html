<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SEU CampusFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            SEU CampusFinder
        </a>
    </div>
</nav>

<div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="form-card w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Reset Password</h2>
            <p class="text-muted">Enter your new password below</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 fs-6">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            
            <div class="mb-4">
                <label class="form-label">New Password</label>
                <div class="position-relative mt-2">
                    <input type="password" name="password" id="password" class="form-control form-control-lg pe-5" required>
                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted" id="togglePassword1" style="border: none; background: transparent; z-index: 10;">
                        <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <div class="position-relative mt-2">
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control form-control-lg pe-5" required>
                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted" id="togglePassword2" style="border: none; background: transparent; z-index: 10;">
                        <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill fw-bold">Update Password</button>
        </form>
    </div>
</div>

<script>
    function toggleVisibility(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    document.getElementById('togglePassword1').addEventListener('click', () => toggleVisibility('password', 'eyeIcon1'));
    document.getElementById('togglePassword2').addEventListener('click', () => toggleVisibility('confirmPassword', 'eyeIcon2'));
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
